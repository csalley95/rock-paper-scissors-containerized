<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css">
        <script src="game.js" defer></script>
    </head>
    <body>
        <h1>✊ Rock Paper Scissors ✋</h1>

        <!-- Choice buttons -->
        <div id="controls">
            <button data-choice="rock">✊ Rock</button>
            <button data-choice="paper">✋ Paper</button>
            <button data-choice="scissors">✌️ Scissors</button>
        </div>

        <!-- Running score -->
        <div id="scoreboard">
            <div class="score-block">
                <span class="score-label">You</span>
                <span class="score-value" id="human-score">0</span>
            </div>
            <div class="score-block">
                <span class="score-label">Computer</span>
                <span class="score-value" id="computer-score">0</span>
            </div>
        </div>

        <!-- Last result banner -->
        <div id="status-banner"></div>

        <!-- Rounds history table -->
        <div id="rounds-section">
            <h2>Round History</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Your Pick</th>
                            <th>Computer Pick</th>
                            <th>Outcome</th>
                            <th>Score (You – CPU)</th>
                        </tr>
                    </thead>
                    <tbody id="rounds-body">
                        <!-- rows added by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <button id="reset-btn">↺ Play Again</button>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"f0f03d0605bf45f1a3b17cf7d5e6861f","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
